<!doctype html>
<!--
  L6 — Mini Dashboard: HTML Frontend  (STARTER)
  ================================================
  Requires the FastAPI backend running at http://localhost:8000
  Start it with: uvicorn mini_api:app --reload --port 8000

  Your goal: build a task management dashboard that communicates with the API.

  Features to implement:
    1. Stats bar — total / done / pending task counts
    2. Task list — loaded via fetch(GET /tasks) on page load
    3. Add task form — POST /tasks with a JSON body
    4. "Mark Done" button per task — PATCH /tasks/{id}/complete
    5. Refresh button — re-fetch the task list
    6. Last-fetched timestamp
    7. Error message if the API is unreachable

  Key patterns:
    • fetch(url, { method, headers, body }) — for POST/PATCH requests
    • JSON.stringify(obj) — convert a JS object to a JSON string for the body
    • Always include "Content-Type": "application/json" on POST/PATCH
    • After any mutation (add, complete), call fetchTasks() to refresh the UI
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Dashboard</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f3f5f9;
        color: #1e293b;
        max-width: 760px;
        margin: 40px auto;
        padding: 24px;
      }

      h1 {
        text-align: center;
        font-size: 32px;
        margin-bottom: 32px;
      }

      /* Statistics cards */
      #stats {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
      }

      #stats p {
        flex: 1;
        background: #e0edff;
        border-radius: 12px;
        padding: 20px 12px;
        text-align: center;
        font-weight: 600;
        line-height: 1.8;
      }

      #stats span {
        font-size: 24px;
        font-weight: bold;
        color: #2563eb;
      }

      /* Main dashboard panel */
      .panel {
        background: white;
        padding: 24px;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      }

      /* Add task form */
      #add-form {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }

      #new-task-input {
        flex: 1;
        min-width: 0;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
      }

      /* Buttons */
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 11px 16px;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover {
        background: #1d4ed8;
      }

      #refresh-btn {
        background: #475569;
      }

      #refresh-btn:hover {
        background: #334155;
      }

      /* Timestamp and status */
      #timestamp {
        color: #64748b;
        font-size: 13px;
        margin: 12px 0;
      }

      #status {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 12px;
      }

      /* Task list */
      #task-list {
        list-style: none;
        padding: 0;
        margin: 20px 0 0;
      }

      #task-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 10px;
      }

      #task-list li span {
        overflow-wrap: anywhere;
      }

      #task-list li button {
        flex-shrink: 0;
      }

      @media (max-width: 600px) {
        body {
          margin: 12px auto;
          padding: 12px;
        }

        #stats {
          gap: 8px;
        }

        #stats p {
          padding: 12px 6px;
          font-size: 13px;
        }

        .panel {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Task Dashboard</h1>

    <!-- Stats bar: show total, done, pending counts -->
    <div id="stats">
      <p>Total: <span id="stat-total">–</span></p>
      <p>Done: <span id="stat-done">–</span></p>
      <p>Pending: <span id="stat-pending">–</span></p>
    </div>

    <div class="panel">
      <!-- Add task form -->
      <form id="add-form">
        <input
          type="text"
          id="new-task-input"
          placeholder="Add a new task…"
          required
        />
        <button type="submit">Add Task</button>
      </form>

      <!-- Refresh button and timestamp -->
      <button id="refresh-btn">↻ Refresh</button>
      <p id="timestamp">Last updated: --</p>

      <!-- Status / error messages -->
      <div id="status">Loading…</div>
      <div id="error-msg" style="color: red"></div>

      <!-- Task list -->
      <ul id="task-list"></ul>
    </div>

    <script>
      const API = "http://localhost:8000";

      // ── DOM references ─────────────────────────────────────────────────
      const taskList = document.querySelector("#task-list");
      const statusDiv = document.querySelector("#status");
      const errorMsg = document.querySelector("#error-msg");
      const timestamp = document.querySelector("#timestamp");
      const addForm = document.querySelector("#add-form");
      const newTaskInput = document.querySelector("#new-task-input");
      const refreshBtn = document.querySelector("#refresh-btn");

      // Stats elements
      const statTotal = document.querySelector("#stat-total");
      const statDone = document.querySelector("#stat-done");
      const statPending = document.querySelector("#stat-pending");

      // ── fetchTasks() ───────────────────────────────────────────────────
      // TODO: Implement this async function
      // Steps:
      //   1. Show a loading message in statusDiv
      //   2. Fetch GET /tasks
      //   3. Check response.ok — throw if not
      //   4. Parse JSON → tasks array
      //   5. Call renderTasks(tasks)
      //   6. Call updateStats(tasks)
      //   7. Update the timestamp
      //   8. In catch: show error in errorMsg (hint: "Is the server running?")

      async function fetchTasks() {
        statusDiv.textContent = "Loading tasks...";
        errorMsg.textContent = "";

        try {
          const response = await fetch(`${API}/tasks`);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const tasks = await response.json();

          renderTasks(tasks);
          updateStats(tasks);

          statusDiv.textContent = "Tasks loaded successfully";
          timestamp.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        } catch (error) {
          errorMsg.textContent = "Could not load tasks. Is the API running?";
          statusDiv.textContent = "Error loading tasks";
        }
      }

      function renderTasks(tasks) {
        taskList.innerHTML = "";

        tasks.forEach((task) => {
          const li = document.createElement("li");

          li.innerHTML = `
                  <span>${task.title} — ${task.done ? "Done" : "Pending"}</span>
                  ${!task.done ? `<button>Mark Done</button>` : ""}
              `;

          if (!task.done) {
            li.querySelector("button").addEventListener("click", () => {
              completeTask(task.id);
            });
          }

          taskList.appendChild(li);
        });
      }

      function updateStats(tasks) {
        const total = tasks.length;
        const done = tasks.filter((task) => task.done).length;
        const pending = total - done;

        statTotal.textContent = total;
        statDone.textContent = done;
        statPending.textContent = pending;
      }

      async function completeTask(id) {
        try {
          const response = await fetch(`${API}/tasks/${id}`, {
            method: "PATCH",
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          await fetchTasks();
        } catch (error) {
          console.error("Complete task error:", error);
          errorMsg.textContent = `Failed to complete task: ${error.message}`;
        }
      }

      addForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const title = newTaskInput.value.trim();

        if (!title) return;

        try {
          const response = await fetch(`${API}/tasks`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ title: title }),
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          newTaskInput.value = "";
          await fetchTasks();
        } catch (error) {
          errorMsg.textContent = "Failed to add task";
        }
      });

      // ── Refresh button ─────────────────────────────────────────────────
      refreshBtn.addEventListener("click", fetchTasks);

      // ── Initial load ───────────────────────────────────────────────────
      fetchTasks();
    </script>
  </body>
</html>
